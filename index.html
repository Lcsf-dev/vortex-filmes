<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/styles/login.css">
    <script src="assets/scripts/login.js"></script>
    <title>Login</title>
</head>
<body>

    <header>
        <img src="assets/images/branding/logo.png" alt="Vortex Filmes">
        <p><a href="home.html">Início</a></p>
    </header>
    <main id="paginalogin">
        <img src="assets/images/backgrounds/login.png" id="login" alt="">

        <div id="blocologin">
            <div id="blocoesquerda">

            <h2>Bem vindo à</h2>
            <h1>Vortex <span>Filmes</span></h1>
            <h3>Sua plataforma de filmes <br> com o melhor da diversão</h3>

        </div>

            <div>
                <form id="form-login">

                <h1>Entrar na sua conta</h1>
                <p>Acesse seu perfil e continue assistindo</p>
                <input type="email" placeholder="E-mail" aria-label="E-mail" required>
                <input type="password" placeholder="Senha" aria-label="Senha" required>

                <button id="entrar" type="submit">Entrar</button>
                </form>


             </div>

        </div>
    </main>
</body>
</html>
